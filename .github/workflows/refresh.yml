name: Monthly data refresh

on:
  schedule:
    - cron: "0 6 3 * *"   # 06:00 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-timesfm.txt
      - name: Build
        run: python -m sightline.build
      - name: Commit new data
        run: |
          git config user.name "sightline-bot"
          git config user.email "sightline-bot@users.noreply.github.com"
          git add web/data/sightline.json
          git diff --cached --quiet || git commit -m "Monthly data refresh"
          git push
